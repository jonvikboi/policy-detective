services:
  # -------------------------------------------------------------
  # 1. Policy Detective Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: policy-detective-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && npm install @agentrhq/webcmd"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.6-27b
      - key: LLM_PROVIDER
        value: groq
      - key: DATABASE_TYPE
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: policy_detective
      - key: WEBCMD_BINARY
        value: webcmd
      - key: WEBCMD_PROFILE
        value: default
      - key: WEBCMD_TIMEOUT
        value: 60
      - key: MAX_CONCURRENT_SCANS
        value: 3
      - key: SCAN_TIMEOUT_MINUTES
        value: 15

  # -------------------------------------------------------------
  # 2. Policy Detective Frontend React Static Site
  # -------------------------------------------------------------
  - type: static
    name: policy-detective-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: policy-detective-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
